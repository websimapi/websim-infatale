<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infatale - Infinite Undertale Experience</title>
    <link rel="stylesheet" href="styles.css">
    <script type="importmap">
    {
      "imports": {
        "vue": "https://unpkg.com/vue@3/dist/vue.esm-browser.js"
      }
    }
    </script>
</head>
<body>
    <div id="app">
        <!-- TITLE SCREEN -->
        <div v-if="currentScreen === 'title'" class="screen title-screen">
            <h1 class="game-title">INFATALE</h1>
            <p class="subtitle">An Infinite Undertale Experience</p>
            <button @click="startGame" class="start-button">START</button>
            <div class="credits">Created with AI assistance</div>
        </div>

        <!-- BATTLE SCREEN -->
        <div v-if="currentScreen === 'battle'" class="screen battle-screen">
            <div class="monster-area">
                <div class="monster" v-if="currentMonster">
                    <div class="monster-sprite" :style="{ backgroundImage: `url(${currentMonster.spriteUrl})` }"></div>
                </div>
            </div>
            
            <div class="battle-box">
                <div v-if="battleState === 'menu'" class="battle-menu">
                    <div class="player-stats">
                        <div class="player-name">{{ player.name }}</div>
                        <div class="player-hp">
                            HP: {{ player.hp }}/{{ player.maxHp }}
                            <div class="hp-bar">
                                <div class="hp-fill" :style="{ width: (player.hp / player.maxHp * 100) + '%' }"></div>
                            </div>
                        </div>
                        <div class="player-lv">LV {{ player.lv }}</div>
                    </div>
                    
                    <div class="dialog-box" v-if="showDialog">
                        <div class="dialog-text" v-html="currentDialog"></div>
                        <div class="dialog-continue" v-if="dialogComplete">* Press Z to continue</div>
                    </div>
                    
                    <div class="action-menu" v-if="!showDialog">
                        <button @click="selectAction('fight')" :class="{ active: selectedAction === 'fight' }">FIGHT</button>
                        <button @click="selectAction('act')" :class="{ active: selectedAction === 'act' }">ACT</button>
                        <button @click="selectAction('item')" :class="{ active: selectedAction === 'item' }">ITEM</button>
                        <button @click="selectAction('mercy')" :class="{ active: selectedAction === 'mercy' }">MERCY</button>
                    </div>
                    
                    <div class="submenu act-menu" v-if="selectedAction === 'act' && !showDialog">
                        <button v-for="(action, index) in currentMonster.actions" :key="index" 
                                @click="performAct(action)">{{ action.name }}</button>
                    </div>
                    
                    <div class="submenu item-menu" v-if="selectedAction === 'item' && !showDialog">
                        <button v-for="(item, index) in player.inventory" :key="index" 
                                @click="useItem(item)">{{ item.name }}</button>
                    </div>
                    
                    <div class="submenu mercy-menu" v-if="selectedAction === 'mercy' && !showDialog">
                        <button @click="performMercy('spare')" :class="{ yellow: currentMonster.canSpare }">Spare</button>
                        <button @click="performMercy('flee')">Flee</button>
                    </div>
                </div>
                
                <div v-if="battleState === 'bulletHell'" class="bullet-hell">
                    <div ref="soulElement" class="player-soul" :style="{ left: soul.x + 'px', top: soul.y + 'px' }"></div>
                    <div v-for="(bullet, index) in bullets" :key="index" 
                         class="bullet" :class="bullet.type"
                         :style="{ left: bullet.x + 'px', top: bullet.y + 'px', width: bullet.width + 'px', height: bullet.height + 'px' }">
                    </div>
                </div>
                
                <div v-if="battleState === 'fightAction'" class="fight-action">
                    <div class="attack-bar">
                        <div class="attack-zone"></div>
                        <div class="attack-line" :style="{ left: attackLinePosition + '%' }"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- GAME OVER SCREEN -->
        <div v-if="currentScreen === 'gameOver'" class="screen game-over-screen">
            <h2>GAME OVER</h2>
            <div class="soul game-over-soul"></div>
            <button @click="restartGame" class="restart-button">TRY AGAIN</button>
        </div>
    </div>
    
    <script type="module" src="main.js"></script>
<script defer src="https://static.cloudflareinsights.com/beacon.min.js/v8c78df7c7c0f484497ecbca7046644da1771523124516" integrity="sha512-8DS7rgIrAmghBFwoOTujcf6D9rXvH8xm8JQ1Ja01h9QX8EzXldiszufYa4IFfKdLUKTTrnSFXLDkUEOTrZQ8Qg==" data-cf-beacon='{"version":"2024.11.0","token":"4c6229722a6346bc8eb5cb0e5eae5d41","server_timing":{"name":{"cfCacheStatus":true,"cfEdge":true,"cfExtPri":true,"cfL4":true,"cfOrigin":true,"cfSpeedBrain":true},"location_startswith":null}}' crossorigin="anonymous"></script>
</body>
</html>
